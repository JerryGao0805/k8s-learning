# 第 09 章：两个 Let's Encrypt 签发者（ClusterIssuer），都用 Cloudflare 做 DNS-01 验证。
#
# DNS-01：cert-manager 用 Cloudflare token 在你的域名下临时加一条 TXT 记录（_acme-challenge.lab.<域名>），
# Let's Encrypt 查到这条记录，就相信"这个域名归你管"，给你签证书。
# 好处：不需要 Let's Encrypt 从公网访问到集群，而且能签通配符证书（*.lab.<域名>）。
#
# 先用 staging（测试环境，签出来的证书浏览器不信任，但没有频率限制）把流程跑通，再换 prod。
# Cloudflare token 放在 cert-manager 命名空间的 Secret cloudflare-api-token 里（不进 git）。
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-staging
spec:
  acme:
    server: https://acme-staging-v02.api.letsencrypt.org/directory
    privateKeySecretRef:
      name: letsencrypt-staging-account    # cert-manager 自动生成的 ACME 账号私钥
    solvers:
      - dns01:
          cloudflare:
            apiTokenSecretRef:
              name: cloudflare-api-token
              key: api-token
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    privateKeySecretRef:
      name: letsencrypt-prod-account
    solvers:
      - dns01:
          cloudflare:
            apiTokenSecretRef:
              name: cloudflare-api-token
              key: api-token

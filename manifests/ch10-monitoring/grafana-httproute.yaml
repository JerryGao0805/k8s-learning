# 第 10 章（要先做完第 09 章）：把 https://grafana.lab.<域名> 接到 Grafana。
# ${LAB_DOMAIN} 在 apply 时由 envsubst 填入。
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: grafana
  namespace: monitoring
spec:
  parentRefs:
    - name: lab
      namespace: gateway
      sectionName: https
  hostnames:
    - grafana.lab.${LAB_DOMAIN}
  rules:
    - backendRefs:
        - name: kube-prometheus-stack-grafana
          port: 80

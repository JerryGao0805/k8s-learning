<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>笔记墙 · notes-app</title>
<style>
  :root {
    --bg: #f6f7f9; --card: #fff; --text: #1d2330; --muted: #6b7280;
    --line: #e5e7eb; --accent: #2563eb; --accent-soft: #e8efff; --danger: #c2410c;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12151b; --card: #1b1f27; --text: #e6e8ee; --muted: #9aa3b2;
      --line: #2b313c; --accent: #6b9bff; --accent-soft: #1f2a44; --danger: #fb923c;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.6 -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB",
          "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
  }
  main { max-width: 720px; margin: 0 auto; padding: 32px 16px 24px; }
  h1 { font-size: 26px; margin: 0; }
  .sub { color: var(--muted); margin: 4px 0 24px; }
  .card {
    background: var(--card); border: 1px solid var(--line); border-radius: 12px;
    padding: 20px; margin-bottom: 20px;
  }
  .card h2 { font-size: 16px; margin: 0 0 12px; }
  button {
    font: inherit; border: 0; border-radius: 8px; padding: 8px 18px; cursor: pointer;
    background: var(--accent); color: #fff;
  }
  button:disabled { opacity: .5; cursor: default; }
  button.ghost { background: transparent; color: var(--accent); padding: 4px 8px; }
  code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13px;
         background: var(--accent-soft); padding: 1px 6px; border-radius: 4px; }
  .hits-row { display: flex; align-items: center; gap: 20px; flex-wrap: wrap; }
  .hits-num { font-size: 34px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .muted { color: var(--muted); font-size: 13px; }
  .tally { list-style: none; padding: 0; margin: 12px 0 0; }
  .tally li { display: flex; align-items: center; gap: 8px; font-size: 13px; margin: 4px 0; }
  .tally:empty { display: none; }
  .tally .bar { height: 8px; background: var(--accent); border-radius: 4px; min-width: 4px; }
  textarea {
    width: 100%; min-height: 72px; resize: vertical; font: inherit; color: var(--text);
    background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 10px;
  }
  .form-foot { display: flex; justify-content: space-between; align-items: center; margin-top: 8px; }
  .notes { list-style: none; padding: 0; margin: 16px 0 0; }
  .notes li { border-top: 1px solid var(--line); padding: 10px 0; }
  .notes .text { white-space: pre-wrap; word-break: break-word; }
  .head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
  .head h2 { margin: 0; }
  .error { color: var(--danger); font-size: 13px; margin: 8px 0 0; }
  .error:empty { display: none; }
  footer { text-align: center; color: var(--muted); font-size: 13px; padding: 8px 0 32px; }
</style>
</head>
<body>
<main>
  <h1>笔记墙</h1>
  <p class="sub">一个跑在 Kubernetes 上的小应用：前端 nginx + Go API + Postgres + Redis</p>

  <section class="card">
    <h2>负载均衡演示</h2>
    <div class="hits-row">
      <button id="hit-btn">点我 +1</button>
      <div>
        <div class="hits-num" id="hits">–</div>
        <div class="muted" id="hit-pod">点一下试试，看看是哪个 Pod 回答的</div>
      </div>
    </div>
    <ul class="tally" id="tally"></ul>
    <p class="error" id="hit-err"></p>
  </section>

  <section class="card">
    <div class="head">
      <h2>笔记</h2>
      <button class="ghost" id="refresh">刷新</button>
    </div>
    <form id="note-form">
      <textarea id="note-text" maxlength="500" placeholder="写点什么……（最多 500 字）" required></textarea>
      <div class="form-foot">
        <span class="muted" id="count">0 / 500</span>
        <button type="submit" id="save-btn">保存</button>
      </div>
    </form>
    <p class="error" id="note-err"></p>
    <ul class="notes" id="notes"></ul>
  </section>
</main>
<footer id="info">正在读取版本信息……</footer>

<script>
  // 所有请求都用相对路径（/api/...）：线上由 Gateway 把 /api 转给 api Service，/ 转给 web Service。
  const $ = (id) => document.getElementById(id);

  async function api(path, options) {
    const res = await fetch(path, options);
    let body = null;
    try { body = await res.json(); } catch (_) { /* 不是 JSON，比如 404 页面 */ }
    if (!res.ok) throw new Error((body && body.error) || `HTTP ${res.status}`);
    return body;
  }

  // ---- 计数器：每次点击记下是哪个 Pod 响应的 ----
  const seen = {}; // pod 名 -> 次数（只在本页面内统计）
  function renderTally() {
    const max = Math.max(...Object.values(seen));
    const ul = $("tally");
    ul.replaceChildren();
    for (const [pod, n] of Object.entries(seen).sort()) {
      const li = document.createElement("li");
      const name = document.createElement("code");
      name.textContent = pod;
      const bar = document.createElement("span");
      bar.className = "bar";
      bar.style.width = `${(n / max) * 160}px`;
      const num = document.createElement("span");
      num.className = "muted";
      num.textContent = `${n} 次`;
      li.append(name, bar, num);
      ul.append(li);
    }
  }

  $("hit-btn").addEventListener("click", async () => {
    $("hit-err").textContent = "";
    try {
      const data = await api("/api/hits");
      $("hits").textContent = data.hits;
      $("hit-pod").replaceChildren("本次由 Pod ", Object.assign(document.createElement("code"), { textContent: data.pod }), " 响应");
      seen[data.pod] = (seen[data.pod] || 0) + 1;
      renderTally();
    } catch (e) {
      $("hit-err").textContent = `计数失败：${e.message}`;
    }
  });

  // ---- 笔记 ----
  async function loadNotes() {
    $("note-err").textContent = "";
    try {
      const notes = await api("/api/notes");
      const ul = $("notes");
      ul.replaceChildren();
      if (notes.length === 0) {
        const li = document.createElement("li");
        li.className = "muted";
        li.textContent = "还没有笔记，写下第一条吧。";
        ul.append(li);
      }
      for (const n of notes) {
        const li = document.createElement("li");
        const text = document.createElement("div");
        text.className = "text";
        text.textContent = n.text; // 用 textContent 而不是 innerHTML，防止 XSS
        const meta = document.createElement("div");
        meta.className = "muted";
        meta.textContent = `#${n.id} · ${new Date(n.created_at).toLocaleString("zh-CN", { hour12: false })}`;
        li.append(text, meta);
        ul.append(li);
      }
    } catch (e) {
      $("note-err").textContent = `读取笔记失败：${e.message}`;
    }
  }

  $("note-text").addEventListener("input", (e) => {
    $("count").textContent = `${[...e.target.value].length} / 500`;
  });

  $("note-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const text = $("note-text").value.trim();
    if (!text) return;
    $("save-btn").disabled = true;
    $("note-err").textContent = "";
    try {
      await api("/api/notes", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ text }),
      });
      $("note-text").value = "";
      $("count").textContent = "0 / 500";
      await loadNotes();
    } catch (err) {
      $("note-err").textContent = `保存失败：${err.message}`;
    } finally {
      $("save-btn").disabled = false;
    }
  });

  $("refresh").addEventListener("click", loadNotes);

  // ---- 页脚：版本号和 Pod 名 ----
  async function loadInfo() {
    try {
      const info = await api("/api/info");
      $("info").textContent = `api 版本 ${info.version} · 由 Pod ${info.pod} 提供`;
    } catch (e) {
      $("info").textContent = `api 暂时不可用（${e.message}）`;
    }
  }

  loadNotes();
  loadInfo();
</script>
</body>
</html>

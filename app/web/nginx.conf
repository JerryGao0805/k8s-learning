# nginx 配置：只做一件事——在 8080 端口提供静态页面 index.html。
# 不做反向代理：/api 的请求由 K8s 的 Gateway（HTTPRoute）直接转给 api Service，不经过 nginx。
#
# 镜像是 nginx-unprivileged（以 UID 101 运行，不能监听 1024 以下端口，所以用 8080）。
# Pod 里根文件系统是只读的，所有需要写的东西（pid、临时文件）都放到 /tmp（挂 emptyDir）。

worker_processes 1;            # 只伺服一个静态页面，一个 worker 足够
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    access_log /dev/stdout;
    sendfile on;
    server_tokens off;          # 响应头里不暴露 nginx 版本号

    server {
        listen 8080;
        root /usr/share/nginx/html;

        # 给 K8s 探针用
        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        location / {
            # 每次都向服务器确认页面有没有更新，发布新版本后刷新就能看到
            add_header Cache-Control "no-cache";
            try_files $uri /index.html;
        }
    }
}
